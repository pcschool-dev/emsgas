<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMS (GAS) · โรงเรียนปากช่อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --brand: #7a1f2b; --bg: #1b1416; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: var(--bg); }
  #app.on { display: block; }
  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(1200px 600px at 50% -10%, #5a1a24 0%, var(--bg) 60%); }
  #gate[hidden] { display: none; }
  .card { width: min(380px, 100%); background: #fff; border-radius: 18px; padding: 28px 24px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .card img { width: 64px; height: 64px; }
  h1 { font-size: 20px; margin: 12px 0 4px; color: #222; }
  p { margin: 0 0 20px; color: #666; font-size: 14px; line-height: 1.6; }
  button { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border-radius: 12px;
    border: 1px solid #dadce0; background: #fff; color: #222; font: inherit; font-size: 15px; cursor: pointer; }
  button:hover { background: #f7f7f7; } button:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 20px; margin-top: 14px; font-size: 13px; color: #b42318; }
  .muted { color: #888; font-size: 12px; margin-top: 16px; }
  #busy { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f2d8dc; font-size: 15px; }
  #busy[hidden] { display: none; }
</style>
</head>
<body>
<div id="busy">กำลังตรวจสอบการเข้าสู่ระบบ…</div>
<div id="gate" hidden>
  <div class="card">
    <img src="https://dss-pc.web.app/icons/icon-192.png" alt="" onerror="this.remove()">
    <h1>EMS ระบบจัดการคะแนน</h1>
    <p>ฉบับทดลองบน Google Sheets · เข้าด้วยบัญชี Google ที่ลงทะเบียนเป็นบุคลากรไว้ (บัญชีโรงเรียนหรือ Gmail)</p>
    <button id="gbtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      เข้าสู่ระบบด้วย Google
    </button>
    <div class="msg" id="msg"></div>
    <div class="muted">ระบบจริงยังอยู่ที่ dss-pc.web.app</div>
  </div>
</div>
<iframe id="app" title="EMS" allow="clipboard-write; fullscreen"></iframe>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
/* หน้าครอบ EMS-GAS: เข้าสู่ระบบด้วย Firebase Auth ของ dss-pc (รองรับ Gmail) แล้วส่งบัตร (ID token) ให้แอปใน iframe
   แอปส่ง {tes:'emsgas', kind:'hello'|'refresh'|'login'|'logout'} มาที่หน้านี้ · ตอบกลับที่ ev.source เท่านั้น */
const EXEC = 'https://script.google.com/macros/s/AKfycbxRvDaWrr-yfI2UffrdFlAg-vQnla6sP7FIdsHXrKlmAdvcT4AmotEHHzDyVrkVplrH/exec';
firebase.initializeApp({ apiKey: 'AIzaSyBysiUHX0Kl-FsDjhz_R9Ce29l9eSFmaZ4', authDomain: 'dss-pc.firebaseapp.com', projectId: 'dss-pc',
  appId: '1:147136938367:web:520dc47476b09c96f7da4a' });
const auth = firebase.auth(), $ = id => document.getElementById(id);
const app = $('app'), gate = $('gate'), busy = $('busy'), msg = $('msg'), btn = $('gbtn');
let appWin = null;

function showGate() { busy.hidden = true; gate.hidden = false; app.classList.remove('on'); app.removeAttribute('src'); appWin = null; btn.disabled = false; }
function showApp() { busy.hidden = true; gate.hidden = true; if (!app.getAttribute('src')) app.src = EXEC; app.classList.add('on'); }
async function sendToken(win, force) {
  const u = auth.currentUser; let token = '';
  try { if (u) token = await u.getIdToken(!!force); } catch (e) {}
  win.postMessage({ tes: 'emsgas-wrap', token, email: u ? u.email : '' }, '*');      // ส่งเข้า iframe ของ Apps Script (origin สุ่มของ googleusercontent)
}
function isMine(w) {
  for (let i = 0; w && i < 8; i++) { if (w === app.contentWindow) return true; if (w === w.parent) return false; w = w.parent; }
  return false;
}
window.addEventListener('message', ev => {
  const d = ev.data;
  if (!d || d.tes !== 'emsgas' || !/\.googleusercontent\.com$/.test(new URL(ev.origin).hostname)) return;
  if (!isMine(ev.source)) return;      // ต้องเป็นหน้าที่อยู่ใน iframe ของเราเท่านั้น (กันหน้าอื่นมาขอบัตร)
  appWin = ev.source;
  if (d.kind === 'hello') sendToken(ev.source, false);
  else if (d.kind === 'refresh') sendToken(ev.source, true);
  else if (d.kind === 'logout' || d.kind === 'login') auth.signOut().then(showGate);
});
btn.onclick = async () => {
  btn.disabled = true; msg.textContent = '';
  const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
  try { await auth.signInWithPopup(p); }
  catch (e) {
    btn.disabled = false;
    msg.textContent = ({ 'auth/popup-blocked': 'เบราว์เซอร์บล็อกหน้าต่างเข้าสู่ระบบ — อนุญาตป๊อปอัปแล้วกดใหม่',
      'auth/popup-closed-by-user': '', 'auth/cancelled-popup-request': '',
      'auth/unauthorized-domain': 'โดเมนนี้ยังไม่ได้เพิ่มใน Firebase → Authentication → Settings → Authorized domains' })[e.code] ?? ('เข้าสู่ระบบไม่สำเร็จ: ' + (e.code || e.message));
  }
};
auth.onAuthStateChanged(u => { if (u) showApp(); else showGate(); });
</script>
</body>
</html>
